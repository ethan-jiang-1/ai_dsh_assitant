# 把 one-shot 的裸 agent runner（`headless-runner` 行）换成挂 assistant preset 的 runner
# —— 本仓 dev 验证专用驱动（战役步骤 B/C/D 的自动化；live 检查档的种子）。
#
# 用法（repo 根）：
#   pnpm dsh --profile dev-task --patch dev/preset-runner.patch.yml "<task>"
#
# 形状说明（loader 守卫：行**替换**不得改 `name`——插件身份不可被 patch 劫持）：
# 先禁用 shipped 的 headless-runner 行，再以**新 id 插入**我们的 runner。
# 已验证：--dump-config 无 warn，`headless-runner` 显示 disabled，`assistant-preset-runner` 在组合中。
# - task 经 loader 侧 `!!js` 从 headlessStartup 服务取（与被替换的行同源）；CLI 位置参数
#   解析发生在 headless-startup 行，不受本替换影响。
# - preset 不设 → roster 默认（dev-task 的 agent-presets 行 default: assistant）。
# - 不带本 patch 的 one-shot 仍是裸 agent —— host 面冒烟语义（AGENTS.md 命令表）不变。
- id: headless-runner
  disabled: true
- insert:
    - id: assistant-preset-runner
      name: dsh-smart-assistant/preset-runner
      inject: [headlessStartup]
      config:
        task: !!js ctx.headlessStartup.task
