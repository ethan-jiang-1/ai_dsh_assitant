# 开发用 profile patch：把默认 preset 设成 `assistant`。
#
# DSH 0.1.7 起 preset 是**普通插件行**（`@deepseek-ai/dsh-agent-preset`），registry 不扫目录、也不接受
# preset 路径 —— 所以这里只替换 registry 行的 `default`；`assistant` 的定义随本包的
# `dsh.bundle.patch`（`cordis.patch.yml` 里的 `preset-assistant` 行）进入组合，改它即刻生效
# （组合按文件 mtime/size 换代，已在跑的会话留在它原来那一代）。
#
# 语义提醒：patch 是**整行 config 替换**，不是合并。shipped 的 registry 行默认 `default: standard`，
# 这里把它换成 assistant；standard/ptc/cordis/minimal 的定义仍在 web-app bundle 里，仍可选。
- id: agent-preset-registry
  config:
    default: assistant
