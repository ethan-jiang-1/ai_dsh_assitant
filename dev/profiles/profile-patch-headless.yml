#
# headless 模板只有 [dsh-base, dsh-headless] —— 没有 web-app，所以 **没有** agent-preset-registry 行
# 可供"整行替换"；这里必须用 `insert` 语义补进 registry（web profile 的 dev/profile-patch.yml
# 用的是替换语义，两个文件不可互换：替换版在 headless profile 里 patch 不到行只 warn，
# insert 版放进 web profile 会撞 duplicate id）。
#
# `assistant` 的**定义**不在 profile 里：它随本包的 `dsh.bundle.patch`（`cordis.patch.yml` 的
# `preset-assistant` 行）进来，所以开发期改 preset 只改那一个文件。
#
# `schedule` 行在这里显式禁用：它注入的 `sessionController` 是 web-app 层的服务
# （web-app patch :121），headless 组合永远等不到——不禁用则每次 one-shot 都挂着一条
# pending warning，把真正的激活失败淹没。Web 组合（产品面）不受影响：schedule 默认带
# 在 bundle patch 里。
- id: schedule
  disabled: true
- insert:
    - id: agent-preset-registry
      name: '@deepseek-ai/dsh-agent-preset-registry'
      config:
        default: assistant
