#
# headless 模板只有 [dsh-base, dsh-headless] —— 没有 web-app，所以 **没有** agent-preset-registry 行
# 可供"整行替换"；这里必须用 `insert` 语义补进 registry。这份文件是 dev overlay 的源：
# setup.sh 把它生成为 `$DSH_HOME/dev-overlay-dev-task.yml`，启动器按 profile 以 `--patch` 注入；
# profile 的用户层 `cordis.patch.yml` 不写（docs/dev.md §十）。
#
# `assistant` 的**定义**不在 profile 里：它随本包的 `dsh.bundle.patch`（`cordis.patch.yml` 的
# `preset-assistant` 行）进来，所以开发期改 preset 只改那一个文件。
#
# 五个 web-only 行（assistant-product / desk-projection / ui-mode / rooms / viki）靠 `inject`
# 等 connection 激活；headless 组合没有该服务，所以这里显式 disabled。不要把这件事写成
# `disabled: !!js "!ctx.get('connection')"`：entry 创建时 connection 还没注册，表达式为真，
# Loader 跳过 entry；等 connection 出现时审计只看到“enabled 无 fiber”，永远不会启动。
# `schedule` 同样由 web-app 自带，headless 组合没有这行；这里也不写。
- insert:
    - id: agent-preset-registry
      name: '@deepseek-ai/dsh-agent-preset-registry'
      config:
        default: assistant
- id: assistant-product
  disabled: true
- id: assistant-desk-projection
  disabled: true
- id: assistant-ui-mode
  disabled: true
- id: assistant-rooms
  disabled: true
- id: assistant-viki
  disabled: true
