# HOST 面：只发布 `assistantMemory` 服务（working folder 的布局 + 四个房间的存储 + 摘要计算 + 养护检查）。
#
# 平面判据（DSH 架构）：HOST 组合持有"跨会话共享的东西" —— 持久化、沙箱、审批栈、模型路由。
# 记忆/探索/技能是**跨会话持久化**，所以服务落在这里。preset 里的服务行必须包在
# `isolate` realm 里，否则与别的 preset 撞名（`dsh-agent-presets` 在挂载时直接拒绝）。
# 落 host 面还有一个好处：将来做记忆面板时，client 读的是同一个实例。
#
# 模型可见的贡献（工具、提示词段落）在**同文件的 `preset-assistant` 行**里 —— DSH 0.1.7 起
# preset 是普通插件行（`@deepseek-ai/dsh-agent-preset`），registry 不扫目录；`config.plugins`
# 就是一个 preset 的子插件列表，`!!js` 保留到子插件加载时才求值。
# **子插件的 `baseUrl` 不是本文件所在目录**：bundle patch 的行继承它落进的那一层，实测是
# **profile 目录**（`<home>/profiles/<name>/`，2026-09-25）。所以本文件里指包内文件的路径一律
# **按包名解析**（`createRequire(baseUrl).resolve('dsh-smart-assistant/package.json')` + 包内相对路径，
# 抄自 shipped `cordis` preset），不写相对 `baseUrl` 的路径 —— 后者会指到包外且静默失效。
- insert:
    - id: assistant-memory
      name: dsh-smart-assistant
      config:
        # dataDir 省略 → <dshHome>/assistant（$DSH_HOME → ~/.dsh，经 resolveDshHome）；
        # 要换地方就在 profile/home 层的 patch 里覆盖这一行（patch 是整行 config 替换）。
        # digestMaxBytes 6144（2026-10-02 校准，4096→6144）：4096 是三房间骨架期定的，
        # 知识签树（第四房间）落地后从未校准——6 记忆+9 线索+3 稳定页就把签树挤到 1/3、
        # 线索只列 3/5，预算闸门被知识节截断误触发（记忆写入门被堵）；预算闸门同日改为
        # 只在记忆行本身被挤下桌面时拒绝纯新增（src/host/memory-room.ts 的 saveMemory；
        # src/index.ts 只是薄导出，不持实现）。
        digestMaxBytes: 6144
        recallLimit: 20
        staleResearchDays: 30

    # 独立 Host 经营目录的只读下载；不创建账本，不接收任意文件路径。
    - id: assistant-desk-projection
      name: dsh-smart-assistant/desk-projection

    # ── 维护面板的房间投影 + 受控写 + 收据 ───────────────────────────────────────
    #
    # 面板读 working folder 四房间真值；GET 取投影/正文/技能/审批账，
    # POST 执行 knowledge.approve/deprecate、memory.correct/retire、memory.remember、
    # skill.retire 白名单动作。route 不接收任意路径；memory.remember 只接收
    # sessionId + messageId。
    - id: assistant-rooms
      name: dsh-smart-assistant/rooms-route

    # ── Viki 记忆内容面 ────────────────────────────────────────────────────────
    #
    # GET /api/assistant/viki：user/<space>/memories + peers/<peer>/memories/**；
    # POST 逐条 delete/restore（带 commit 回执）。
    # baseUrl/apiKey 来自 config，其次 OPENVIKING_URL/OPENVIKING_API_KEY；server 缺席时
    # 503（面板显示未连接），不阻断启动。
    - id: assistant-viki
      name: dsh-smart-assistant/viki

    # ── 权威经营账本（desk-operating-entry K3，2026-10-10）────────────────────────
    #
    # 单 Host writer：独立 `assistant-operating` dataDir、writer.lock 跨进程独占（惰性认领——
    # 首次写才抢锁，所以同 home 的 web 与 one-shot 两 profile 可共存到其中之一写入）。
    # 语义遵循归档卡 261008 的 V1–V3（V4/V5 提醒协调随后）；模型面入口在同文件
    # `preset-assistant` 的 `assistant-operating-tool` 行。dataDir 省略 → <dshHome>/assistant-operating。
    - id: assistant-operating-ledger
      name: dsh-smart-assistant/operating-ledger

    # ── 知识批准直调（approve-direct-call 卡，2026-10-04）──────────────────────────
    #
    # 首开 UX 摩擦 1：批准曾是「面板发指令 → 模型跑一轮（promote + 旧房间改写，60-90s）」，「
    # 而批准本体是机械翻转（draft→stable），不需要模型智能。本行把翻转经 Typert Remote
    # 暴露给 client 直调：秒级生效；审计不丢——每次批准经 `promotePage` 追加一行进共享
    # 批准台账 `<dataDir>/audit/approvals.jsonl`（`source: 'panel-direct'` 区分点击与模型
    # 回合；session 事件方案已推翻——未知事件类型带不了 `ignorable`，会毒化日志；修订记录
    # 见 src/host/knowledge-approve-remote/index.ts 头注）。
    # 依赖 assistantMemory（host 行先挂，Loader 顺序即本文件顺序）+ typert（Remote 协议本体）。
    - id: assistant-knowledge-approve
      name: dsh-smart-assistant/knowledge-approve-remote

    # ── 会话全文检索（翻开 base 出厂关着的 seam；adoption 卡 B1 片，2026-09-30）────────
    #
    # base 的 `session-query-sqlite` 行出厂 `openAt: never` + `:memory:`（base:149-153，注释明说
    # 后续层翻开）。本行 = 整行 config 替换：`first-search`（首次检索才建索引，不付启动税）+
    # 持久库（DSH home 根，重启后历史仍可搜；**独立的派生索引**，绝不指向 session-persistence 库）。
    # 路径经 `dshHomePath` 解析（peer 现货 `@deepseek-ai/dsh-home-paths`），不手拼 DSH_HOME——
    # env 兜底/展开逻辑在 helper 里，patch 里复刻一遍就是第二份清单。
    - id: session-query-sqlite
      name: '@deepseek-ai/dsh-session-query-sqlite'
      config:
        path: !!js |-
          process.getBuiltinModule('node:module').createRequire(baseUrl)('@deepseek-ai/dsh-home-paths').dshHomePath('session-search.db')
        openAt: first-search

    # ── 时间上下文（adoption 卡 B2 片，2026-09-30）────────────────────────────────────
    #
    # 现货 `@deepseek-ai/dsh-time-context`（schedule-bundle 里同款行，此处独立挂）：
    # 给模型当前时间/时区/经过时长——stale 判断（`staleResearchDays`、知识页保鲜）与
    # "下周提醒我"类表达需要"今天是几号"在请求里。Config 全默认（进程时区 + 10 分钟注入间隔）。
    - id: time-context
      name: '@deepseek-ai/dsh-time-context'

    # ── 定时面：schedule 默认带（C1 反转，用户 2026-10-02 拍板）──────────────────────
    #
    # 0.2.0 起 Schedule 以可选 bundle 交付（`schedule-bundle`，OPTIONAL_BUNDLES，插件页
    # 一键开），C1 原"文档指引不默认带"的 experimental 前提过期 → 反转为默认带。
    # 两行照抄 schedule-bundle 的 patch（time-context 行我们已有，不重复）；它自己就是
    # "借力不瞎折腾"的样本：到期投递 = 原会话 follow-up 消息，持久化、重启后仍投递，
    # 全部上游维护。`dsh-schedule` 只给 root agents 挂 schedule_create/list/update/delete
    # 四工具（`ctx.agents.roots()`，schedule/src/index.ts:170）——子代理不重复拿到；
    # 养护检查定时触发（原 C1 预留的接入点）与"每周提醒我过经营状况"类主动感都走它。
    - id: schedule
      name: '@deepseek-ai/dsh-schedule'

    - id: ui-schedule
      name: '@deepseek-ai/dsh-client-ui-schedule'

    # ── 首开预置（首开 UX 卡 261001，2026-10-01）──────────────────────────────────
    #
    # 两行都是"同 id 整行替换"覆盖 web-app 出厂行（session-query-sqlite 同先例）：
    #
    # `ui-chat.transcriptView`：此 pin 的 vendor **预构建 client bundle 落后于其 src**——
    # src 的 `TranscriptViewPolicy.adopt()` 有 `?? defaultMode` 兜底，lib/client.js 没有；
    # 全新 home 无存档时 mode=undefined → `POLICIES[undefined]` → conversation.view 槽崩溃
    # （首条消息后对话区整片冻结，实测复现 + 修后消失，见首开 UX 卡第 3/8 轮）。
    # 预置一个合法档位绕开。退役条件（2026-10-03 校准）：本 pin src 已带兜底、开发树 lib 已重建
    # （首开 UX 卡「升 pin 复验」节），但**发布人口**（release-smoke 干净安装所用的 dsh 发布物
    # 自带 client lib）是否带兜底未验——上游发布物确认后此行可退役。
    - id: ui-chat
      name: '@deepseek-ai/dsh-client-ui-chat'
      config:
        transcriptView: detailed

    # `locale.preference`：目标用户是中文管理者，zh 字典 vendor 全套自带，但无偏好时
    # 首开语言随浏览器协商（英文浏览器落回 en——首屏满英文，owner 2026-10-01 的直接投诉）。
    # 这里给**产品默认**；Settings→General 可随时改（持久化到 home 层，覆盖本行）。
    - id: locale
      name: '@deepseek-ai/dsh-client-locale'
      config:
        preference: zh

    # ── 技能目录工具（host 行，BUG-001 修复，2026-10-02）────────────────────────────
    #
    # tool-skill 以 preset 行挂载时，其目录监听器在 one-shot 会话里从不发布
    # <available_skills>（host 层实例可发布——裸 one-shot 实测），模型无从知道技能存在，
    # `skill-loaded` 类行为全部退化为"提示词点名才加载"。移到 host 行（web 侧同 id 覆盖
    # web-app 的 disabled 行——session-query/ui-chat 同先例；headless 侧覆盖 base 活行，
    # 形状不变）后目录随首请求发布。诊断与证据：BUG-001 归档卡。
    - id: tool-skill
      name: '@deepseek-ai/dsh-tool-skill'

# ── AGENT 面：`assistant` preset（0.1.7 起是普通行，随本 bundle 分发）────────────────
#
# 打包形状：一个专家 = 一个 `agent-preset` 行；换领域 = 换包。registry 行（`default: assistant`）
# 由 profile 提供；本行随 `dsh.bundle.patch` 进入组合，所以 profile 不需要任何 preset 路径。
# `assistant` agent preset —— 智能助手的 AGENT 面组合。
#
# 这是一个 AGENT-PLANE 组合。roster 只把它挂**一次**（standing scope），
# 命名它的每个会话按 scope 父子关系加入：这里注册的工具与提示词段落覆盖每个加入的 agent，
# 而每个会话自己的状态按 Session/Agent 键控在插件内部。
# 服务（`assistantMemory`）不在这个文件里 —— 它在 HOST 面（`cordis.patch.yml`）。
#
# TRUST：这个 preset 能读写 agent 自己的 working folder（记忆、探索线索、技能、知识页）。任何 preset
# 都是受信配置，因为它授权它所选插件的能力；挂它等于把 working folder 交给它。
#
# 四间房与两档出口的契约见 `docs/home.md`；身份名以 `docs/identity.md` 为唯一权威。

# ── 身份 ────────────────────────────────────────────────────────────────────

    - id: preset-assistant
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: assistant
        name: 章鱼管家
        order: 5
        description: 替你盯经营事项的章鱼管家——桌面全貌、持续跟踪、主动提醒：受托的事进权威账本，事事有着落。
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              # 0.2.1 起 loop 不再注册内置 `{{cwd}}` 变量（升级指南 working-directory），未解析的引用会在
              # 每次模型请求前失败；目录现由 upstream working-directory 服务作为必需 user context 提供。
              # 故 suffix 整条移除——留一个空串没有意义，其余文本已无。
              prefix: |-
                You are a long-lived assistant. Your full identity and your working folder's operating manual ride in
                the sections right below this one.

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

          # ── working folder：桌面上方的常驻面（身份 + 手册 + 有界状态）──────────────────
          #
          # 桌面常驻段落中的前三段在此，讲一个顺序的故事：你是谁（SOUL.md，紧贴 persona stub）→
          # working folder 怎么用（AGENTS.md）→ 里面现在有什么（有界摘要）；第四段（经营账本）在
          # assistant-operating-brief 行。身份与手册是 working folder 根部的两个文件——拥有者的数据，
          # 不是 preset 代码（现行合同 = docs/home.md §三「桌面与抽屉」与 §五「根部的两个文件」）。
          # 每段各自成行，部署可独立关掉或替换 —— 上下文控制是一等公民。
          # 摆位分两带（2026-10-02 起）：稳定内容（soul 100 / manual 300）留在前带紧贴身份；**易变内容
          # （digest，每次记忆写入都变）移到尾部带 10150**（环境事实 10000/10100 之后、persona 后缀 10200
          # 之前）——DSH 的 KV 前缀纪律：易变内容坐在工具段前面，一次 save 就把全部可共享前缀作废。
          - id: assistant-home-preamble
            name: dsh-smart-assistant/home-preamble

          # 摘要有界（digestMaxBytes），不会挤掉眼前的工作；细节用工具取（抽屉）。
          - id: assistant-memory-digest
            name: dsh-smart-assistant/memory-digest

          # ── working folder：抽屉（工具）──────────────────────────────────────────────
          #
          # 自有工具的动词集互不重叠，所以不合并（完整清单 = docs/package-catalog.md）：
          #   assistant_memory   recall/save/forget/list/curate   —— 已确立的事实、偏好、决定
          #   assistant_research open/update/park/drop/promote/list —— 未决的线索（backlog 两档出口）
          #   assistant_reflect  brief/save_skill/retire_skill/save_page/promote_page/deprecate_page/
          #                      propose_skill/land_skill         —— 把经历变成记忆、技能与知识页
          #   assistant_knowledge search/get（只读）               —— 知识页检索（写入走 reflect/promote）
          - id: assistant-memory-tool
            name: dsh-smart-assistant/tool-memory

          # A2: native read-only OpenViking recall (production candidate; A/B verdict in
          # _backlog/research/tech-exploration/261021-recall-ab.md).
          - id: assistant-recall-tool
            name: dsh-smart-assistant/tool-recall

          - id: assistant-research-tool
            name: dsh-smart-assistant/tool-research

          # ── 经营账本工具（desk-operating-entry K3）────────────────────────────────
          #
          # 消费 host 行 assistant-operating-ledger 的服务。权限分界全部在 description 里：
          # 普通进展 report/note 恒安全；revise/complete/reopen/confirm 只走本人明确指令；
          # 推断的重大变化只能 propose。溯源由工具盖章（真实 session id），模型不可伪造。
          - id: assistant-operating-tool
            name: dsh-smart-assistant/tool-operating

          # ── 经营账本提示词段落（K3 行为修复，2026-10-10）───────────────────────────
          #
          # 首轮 eval 发现：工具在场但模型用散文应答交代请求。工具没人介绍=模型合理跳过。
          # 本段是介绍：受托经营事项必须走 assistant_operating，推断的重大变化只能
          # propose、完成需逐字依据、无归属片段 note 待认领。稳定指令带（manual 300 后）。
          - id: assistant-operating-brief
            name: dsh-smart-assistant/operating-brief

          # ── working folder：知识（第四房间，只读检索面）──────────────────────────────
          #
          # 写入走 reflect（save_page，staged draft）与 research promote——本工具刻意只读（D6 定值）：
          # 检索=search/get 附反链，反链全房间现算，无索引服务。
          - id: assistant-knowledge-tool
            name: dsh-smart-assistant/tool-knowledge

          # ── 会话检索（与 knowledge 房的分工：adoption 卡 B1 片）──────────────────────
          #
          # knowledge 房 = 我们自己提炼过的知识页（带反链、经 curate）；session_query 族 =
          # **原始会话证据**的全文检索（SQLite FTS5，host 面 session-query-sqlite 已翻开）。
          # "上次怎么定的 X"走这里，不进 knowledge 房。Config 用默认（100 条 / 30s）。
          - id: tool-session-query
            name: '@deepseek-ai/dsh-tool-session-query'

          - id: assistant-learn
            name: dsh-smart-assistant/learn

          # ── OpenViking 治理遮蔽（推敲卡 260929 §六/§七.②，对抗评审定稿 2026-10-04）────────
          #
          # 部署若采用 OpenViking，其插件无条件挂 MCP 工具面与第二技能目录（0.5.x 两旋钮皆死）。
          # 本行是治理执法面：整前缀拒 `mcp__openviking__*`（fail-closed，上游新增写面同轮被拒），
          # 两个 ov 技能名以显式双 false 遮蔽。价值不受损：画像与召回块内联内容，模型所需不在被拒
          # 工具后面。OpenViking 缺席时模型可见面零影响（幽灵条目只出现在不过滤的 list() 中立视图）。
          # 全前缀拒 vs 拒 6 写放只读的裁决与输掉的方案：见推敲卡 §七.② 与 ov-shield 模块注释。
          - id: assistant-ov-shield
            name: dsh-smart-assistant/ov-shield
            config:
              denyToolPrefix: mcp__openviking__
              denyServerResources: openviking
              shadowSkills:
                - openviking-memory
                - openviking-skills

          # ── 技能：两个来源 ──────────────────────────────────────────────────────────
          #
          # 技能注册表（`ctx.skills`）在 HOST 组合里，且按 scope 分层：这里的行注册进**本 preset 的层**，
          # 所以不需要 realm。
          #   · 策展技能：本 preset 目录下的 `skills/`（人写的、随 repo 版本化）—— 按**包名**解析到
          #     包内路径（`baseUrl` 是 profile 目录，不是包根：见文件头）。
          #   · 学到的技能：由 `assistant-learn` 自己挂载第二个 `dsh-skill-filesystem` 实例
          #     （`providerName: assistant-learned`，只扫 working folder 的 `skills/`）—— 路径从服务取，零漂移。
          # 分成两个 provider 是刻意的：一眼能看出一个技能是"策展的"还是"学来的"。
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              customSkillDirs:
                - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('dsh-smart-assistant/package.json')), 'presets/assistant/skills')

          # ── 文件系统（读 working folder、读工作区）───────────────────────────────────
          #
          # 两行都只注册进 host `tools` 注册表、不发布服务，所以不需要 realm。
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

          # ── shell ───────────────────────────────────────────────────────────────────

          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'

          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'

          # ── 其余模型可见行 ──────────────────────────────────────────────────────────

          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true

          # `web` 服务与它的搜索 provider 在 HOST 组合；这里只要模型可见的工具。
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000

          # ── 后台任务（standard 同款：一行无 config）──────────────────────────────────
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'

          # ── 任务面：目标与计划（照抄 shipped `standard` preset 的行形状，2026-09-30）────
          #
          # goal 三工具 + `/goal` 命令：跨 turn 的目标推进（培养循环、评测 campaign 的承载面）。
          # planning 是 isolate 组（`planMode` 键独立 realm）；`section` 文案逐字取自
          # `packages/bundle/web-app/presets/standard.patch.yml` —— plan 呈批是本仓开发流程
          # （根 AGENTS.md 硬规则 5）宣称依赖的机制，此前只挂了 todo 一半（adoption 卡
          # notes/archived/2026-09-30-stock-plugin-adoption.md A1 片）。
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'

          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'

          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

          # ── 委派（照抄 shipped `standard` preset 的 `delegation` 组形状，2026-09-30）────
          #
          # spawn/fork 两个进程内后端（fork 可续跑）+ control 三件套；codex/claude-code 照抄
          # disabled 占位（显式 opt-in 才开）。workflow 三行是 adoption 卡的观望项，不挂——
          # 但 `isolate: workflowEngine` 键随组保留（与 standard 同形状；组内无 provider 时
          # 该键只声明隔离意图，dump-config 无 warn 为判据）。
          # 偏离 standard 一处：不抄 `modelSelectionSettings: true` —— 它要求 host 作用域有
          # web-app 层的 `subagent-model-selection-settings` 行，headless（dev-task / 一次性
          # 任务）没有该层，挂上即 fail-loud（2026-09-30 实测）。理由与证据见 adoption 卡 A2 片。
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'

              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent

              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork

              - id: tool-subagent-codex
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: codex
                  toolName: subagent_codex
                  maxDepth: provider-managed

              - id: tool-subagent-claude-code
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: claude-code
                  toolName: subagent_claude_code
                  maxDepth: provider-managed

          - id: tool-present
            name: '@deepseek-ai/dsh-tool-present'

          # ── 压缩（上下文控制的另一半）───────────────────────────────────────────────
          #
          # `compaction-basic` 通过 `ctx.get` 读 `toolResultPrune`，所以 pruner 必须与它同 realm，
          # 而不是坐在 realm 外面。`tokenMeter` 刻意**不**在这个 realm 里：它留在 HOST 面，
          # 按 Session 键控、拥有浏览器读的上下文计量单位。
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'

              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
