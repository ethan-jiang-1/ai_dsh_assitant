# HOST 面：只发布 `assistantMemory` 服务（working folder 的布局 + 四个房间的存储 + 摘要计算 + 养护检查）。
#
# 平面判据（DSH 架构）：HOST 组合持有"跨会话共享的东西" —— 持久化、沙箱、审批栈、模型路由。
# 记忆/探索/技能是**跨会话持久化**，所以服务落在这里。preset 里的服务行必须包在
# `isolate` realm 里，否则与别的 preset 撞名（`dsh-agent-presets` 在挂载时直接拒绝）。
# 落 host 面还有一个好处：将来做记忆面板时，client 读的是同一个实例。
#
# 模型可见的贡献（工具、提示词段落）在**同文件的 `preset-assistant` 行**里 —— DSH 0.1.7 起
# preset 是普通插件行（`@deepseek-ai/dsh-agent-preset`），registry 不扫目录；`config.plugins`
# 就是一个 preset 的子插件列表，`!!js` 保留到子插件加载时才求值。
# **子插件的 `baseUrl` 不是本文件所在目录**：bundle patch 的行继承它落进的那一层，实测是
# **profile 目录**（`<home>/profiles/<name>/`，2026-09-25）。所以本文件里指包内文件的路径一律
# **按包名解析**（`createRequire(baseUrl).resolve('dsh-smart-assistant/package.json')` + 包内相对路径，
# 抄自 shipped `cordis` preset），不写相对 `baseUrl` 的路径 —— 后者会指到包外且静默失效。
- insert:
    - id: assistant-memory
      name: dsh-smart-assistant
      config:
        # dataDir 省略 → <dshHome>/assistant（$DSH_HOME → ~/.dsh，经 resolveDshHome）；
        # 要换地方就在 profile/home 层的 patch 里覆盖这一行（patch 是整行 config 替换）。
        digestMaxBytes: 4096
        recallLimit: 20
        staleResearchDays: 30

# ── AGENT 面：`assistant` preset（0.1.7 起是普通行，随本 bundle 分发）────────────────
#
# 打包形状：一个专家 = 一个 `agent-preset` 行；换领域 = 换包。registry 行（`default: assistant`）
# 由 profile 提供；本行随 `dsh.bundle.patch` 进入组合，所以 profile 不需要任何 preset 路径。
# `assistant` agent preset —— 智能助手的 AGENT 面组合。
#
# 这是一个 AGENT-PLANE 组合。roster 只把它挂**一次**（standing scope），
# 命名它的每个会话按 scope 父子关系加入：这里注册的工具与提示词段落覆盖每个加入的 agent，
# 而每个会话自己的状态按 Session/Agent 键控在插件内部。
# 服务（`assistantMemory`）不在这个文件里 —— 它在 HOST 面（`cordis.patch.yml`）。
#
# TRUST：这个 preset 能读写 agent 自己的 working folder（记忆、探索线索、技能、知识页）。任何 preset
# 都是受信配置，因为它授权它所选插件的能力；挂它等于把 working folder 交给它。
#
# 四间房与三档出口的契约见 `docs/home.md`；身份名以 `docs/identity.md` 为唯一权威。

# ── 身份 ────────────────────────────────────────────────────────────────────

    - id: preset-assistant
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: assistant
        name: 智能助手
        order: 5
        description: 有自己的 working folder（跨会话的工作目录）：长期记忆、探索线索、领域知识页、自己写的技能，以及机器能跑的养护检查。
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are a long-lived assistant. Your full identity and your working folder's operating manual ride in
                the sections right below this one.
              suffix: Your working directory is {{cwd}}.

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

          # ── working folder：桌面上方的常驻面（身份 + 手册 + 有界状态）──────────────────
          #
          # 三个段落讲一个顺序的故事：你是谁（SOUL.md，紧贴 persona stub）→ working folder 怎么用（AGENTS.md）
          # → 里面现在有什么（有界摘要）。身份与手册是 working folder 根部的两个文件——拥有者的数据，不是
          # preset 代码（决定 notes/implemented/2026-09-24-soul-and-agents.md，D1/D2/D3=a）。每段各自成行，
          # 部署可独立关掉或替换 —— 上下文控制是一等公民。
          - id: assistant-home-preamble
            name: dsh-smart-assistant/home-preamble

          # 摘要有界（digestMaxBytes），不会挤掉眼前的工作；细节用工具取（抽屉）。
          - id: assistant-memory-digest
            name: dsh-smart-assistant/memory-digest

          # ── working folder：抽屉（工具）──────────────────────────────────────────────
          #
          # 四个工具的动词集互不重叠，所以不合并：
          #   assistant_memory   recall/save/forget/list/curate   —— 已确立的事实、偏好、决定
          #   assistant_research open/update/park/drop/promote/list —— 未决的线索（backlog 三档出口）
          #   assistant_reflect  brief/save_skill/retire_skill/save_page/promote_page/deprecate_page/
          #                      propose_skill/land_skill         —— 把经历变成记忆、技能与知识页
          #   assistant_knowledge search/get（只读）               —— 知识页检索（写入走 reflect/promote）
          - id: assistant-memory-tool
            name: dsh-smart-assistant/tool-memory

          - id: assistant-research-tool
            name: dsh-smart-assistant/tool-research

          # ── working folder：知识（第四房间，只读检索面）──────────────────────────────
          #
          # 写入走 reflect（save_page，staged draft）与 research promote——本工具刻意只读（D6 定值）：
          # 检索=search/get 附反链，反链全房间现算，无索引服务。
          - id: assistant-knowledge-tool
            name: dsh-smart-assistant/tool-knowledge

          - id: assistant-learn
            name: dsh-smart-assistant/learn

          # ── 技能：两个来源 ──────────────────────────────────────────────────────────
          #
          # 技能注册表（`ctx.skills`）在 HOST 组合里，且按 scope 分层：这里的行注册进**本 preset 的层**，
          # 所以不需要 realm。
          #   · 策展技能：本 preset 目录下的 `skills/`（人写的、随 repo 版本化）—— 按**包名**解析到
          #     包内路径（`baseUrl` 是 profile 目录，不是包根：见文件头）。
          #   · 学到的技能：由 `assistant-learn` 自己挂载第二个 `dsh-skill-filesystem` 实例
          #     （`providerName: assistant-learned`，只扫 working folder 的 `skills/`）—— 路径从服务取，零漂移。
          # 分成两个 provider 是刻意的：一眼能看出一个技能是"策展的"还是"学来的"。
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              customSkillDirs:
                - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('dsh-smart-assistant/package.json')), 'presets/assistant/skills')

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          # ── 文件系统（读 working folder、读工作区）───────────────────────────────────
          #
          # 两行都只注册进 host `tools` 注册表、不发布服务，所以不需要 realm。
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

          # ── shell ───────────────────────────────────────────────────────────────────

          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'

          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'

          # ── 其余模型可见行 ──────────────────────────────────────────────────────────

          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true

          # ── 任务面：目标与计划（照抄 shipped `standard` preset 的行形状，2026-09-30）────
          #
          # goal 三工具 + `/goal` 命令：跨 turn 的目标推进（培养循环、评测 campaign 的承载面）。
          # planning 是 isolate 组（`planMode` 键独立 realm）；`section` 文案逐字取自
          # `packages/bundle/web-app/presets/standard.patch.yml` —— plan 呈批是本仓开发流程
          # （根 AGENTS.md 硬规则 5）宣称依赖的机制，此前只挂了 todo 一半（adoption 卡
          # notes/proposed/2026-09-30-stock-plugin-adoption.md A1 片）。
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'

          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'

          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

          # `web` 服务与它的搜索 provider 在 HOST 组合；这里只要模型可见的工具。
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000

          - id: tool-present
            name: '@deepseek-ai/dsh-tool-present'

          # ── 压缩（上下文控制的另一半）───────────────────────────────────────────────
          #
          # `compaction-basic` 通过 `ctx.get` 读 `toolResultPrune`，所以 pruner 必须与它同 realm，
          # 而不是坐在 realm 外面。`tokenMeter` 刻意**不**在这个 realm 里：它留在 HOST 面，
          # 按 Session 键控、拥有浏览器读的上下文计量单位。
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'

              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
